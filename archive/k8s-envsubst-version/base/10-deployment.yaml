apiVersion: apps/v1
kind: Deployment
metadata:
  name: user1-web
  namespace: user1
  labels:
    app: user1-web
    tenant: user1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user1-web
  template:
    metadata:
      labels:
        app: user1-web
        tenant: user1
    spec:
      containers:
        - name: web
          image: tenant-website:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: TENANT
              value: user1
            - name: PORT
              value: "3000"
